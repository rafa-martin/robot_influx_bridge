services:
  influxdb:
    image: influxdb:2.7.12-alpine
    restart: unless-stopped
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: adminpassword
      DOCKER_INFLUXDB_INIT_ORG: myorg
      DOCKER_INFLUXDB_INIT_BUCKET: mybucket
      DOCKER_INFLUXDB_INIT_RETENTION: 1w
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: my-super-secret-auth-token

  telegraf:
    image: telegraf:1.36.2-alpine
    restart: unless-stopped
    depends_on:
      - influxdb
    volumes:
      - ./telegraf.conf:/etc/telegraf/telegraf.conf:ro
    environment:
      DOWNSTREAM_INFLUXDB_TOKEN: my-robot-token
      ROBOT_ID: ${HOSTNAME:-robot}
      UPSTREAM_INFLUXDB_URL: http://influxdb:8086
      UPSTREAM_INFLUXDB_TOKEN: my-super-secret-auth-token
      UPSTREAM_INFLUXDB_ORG: myorg
      UPSTREAM_INFLUXDB_BUCKET: mybucket
    ports:
      - target: 8087
        published: 8087
        protocol: tcp
        mode: host

  grafana:
    image: grafana/grafana:11.6.0
    restart: unless-stopped
    depends_on:
      - influxdb
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: adminpassword

volumes:
  influxdb_data:
  grafana_data:

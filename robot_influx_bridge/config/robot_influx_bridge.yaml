/**:
  ros__parameters:
    influx:
      url: "http://localhost:8086"
      org: "myorg"
      bucket: "mybucket"
      token: "my-super-secret-auth-token"

    writer:
      max_batch: 1000
      max_queue: 100000
      flush_ms: 500

    mappings_ids:
      - imu

    imu:
      topic: "/imu"
      translator: "robot_influx_common_interfaces::ImuTranslator"
      measurement: "imu"
      tag_keys:
        - frame_id=imu_link

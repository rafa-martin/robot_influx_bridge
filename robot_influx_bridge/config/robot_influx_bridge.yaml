/**:
  ros__parameters:
    influx:
      url: "http://localhost:8087"
      org: ""
      bucket: ""
      token: "my-super-secret-auth-token"

    writer:
      max_batch: 1000
      max_queue: 100000
      flush_ms: 5000
      use_gzip: true

    mappings_ids:
      - imu

    imu:
      topic: "/imu"
      translator: "robot_influx_common_interfaces::ImuTranslator"
      measurement: "imu"
      min_interval_ms: 5
      tag_keys:
        - frame_id=imu_link

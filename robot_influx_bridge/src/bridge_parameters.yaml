influx_bridge:
  influx:
    url:
      type: string
      default_value: "http://localhost:8086"
      description: "InfluxDB HTTP endpoint. Format: http(s)://host:port"
      additional_constraints: "Must include scheme and port."
    org:
      type: string
      default_value: "org"
      description: "InfluxDB organization."
    bucket:
      type: string
      default_value: "bucket"
      description: "InfluxDB bucket to write to."
    token:
      type: string
      default_value: "token"
      description: "InfluxDB API token with write permission."
      additional_constraints: "Treat as secret."

  writer:
    max_batch:
      type: int
      default_value: 1000
      description: "Max points per HTTP write."
      validation: { gt<>: [0] }
    max_queue:
      type: int
      default_value: 100000
      description: "Max queued points awaiting send."
      validation: { gt_eq<>: [0] }
    flush_ms:
      type: int
      default_value: 500
      description: "Background flush period in milliseconds."
      validation: { gt_eq<>: [1] }
    use_gzip:
      type: bool
      default_value: false
      description: "Compress HTTP payloads with gzip."
    persistence_path:
      type: string
      default_value: "/tmp/robot_influx_bridge"
      description: "Directory where batches are persisted while InfluxDB is unavailable."
    persistence_max_megabytes:
      type: int
      default_value: 128
      description: "Maximum size in megabytes for the on-disk persistence queue. Older batches are dropped once the limit is reached."
      validation: { gt_eq<>: [0] }

  mappings_ids:
    type: string_array
    default_value: []
    description: "List of mapping IDs (e.g., ['imu','odom'])."

  __map_mappings_ids:
    topic:
      type: string
      description: "ROS 2 topic name to subscribe. Absolute topic recommended."
      additional_constraints: "Example: /imu"
    translator:
      type: string
      description: "Pluginlib class name of the translator to use."
      additional_constraints: "Example: robot_influx_common_interfaces::ImuTranslator"
    measurement:
      type: string
      default_value: ""
      description: "InfluxDB measurement name. If empty, translator decides."
    tag_keys:
      type: string_array
      default_value: []
      description: "List of key=value fields to store as tags instead of fields."
    max_rate:
      type: double
      default_value: 0.0
      description: "Maximum frequency (Hz) at which messages from this topic are processed."
      validation: { gt_eq<>: [0.0] }
    qos_history:
      type: string
      default_value: "keep_last"
      description: "QoS history policy (keep_last or keep_all)."
    qos_depth:
      type: int
      default_value: 10
      description: "Queue depth to use when history is keep_last."
      validation: { gt_eq<>: [0] }
    qos_reliability:
      type: string
      default_value: "reliable"
      description: "QoS reliability policy (reliable or best_effort)."
    qos_durability:
      type: string
      default_value: "volatile"
      description: "QoS durability policy (volatile or transient_local)."
